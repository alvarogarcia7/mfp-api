[project]
name = "myfitnesspal-api"
version = "0.1.0"
description = "Self-hosted MyFitnessPal web app with login and food logging"
requires-python = ">=3.10,<=3.13"
authors = [{ name = "Your Name" }]
license = "MIT"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "myfitnesspal==2.1.2",
    "curl-cffi>=0.15,<0.16",
    "lxml>=5,<6",
    "python-multipart",
    "jsonschema>=4.17",
    "vcrpy>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.0",
    "httpx>=0.26",
    "mypy>=1.5",
    "pre-commit>=3.0",
]


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]

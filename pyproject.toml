[project]
name = "myfitnesspal-api"
version = "0.1.0"
description = "Self-hosted MyFitnessPal web app with login and food logging"
requires-python = ">=3.10"
authors = [{ name = "Your Name" }]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "myfitnesspal==2.1.2",
    "curl-cffi>=0.15,<0.16",
    "lxml>=5,<6",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.26",
]

[tool.uv]
python-version = "3.10"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
